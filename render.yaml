services:
  # ─── Web Dashboard v2 ─────────────────────────────────────
  - type: web
    name: tgparser-v2-web
    runtime: docker
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tgparser-v2-db
          property: connectionString
      - key: APP_MODE
        value: "web"
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        sync: false   # задать вручную в дашборде Render (secret)
      - key: RSS_NEWS_TITLE
        value: "Новости"
      - key: RSS_ANALYTICS_TITLE
        value: "Аналитика"

  # ─── Cron Job: парсинг каждые 5 минут ─────────────────────
  - type: cron
    name: tgparser-v2-cron
    runtime: docker
    schedule: "*/5 * * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tgparser-v2-db
          property: connectionString
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_STRING_SESSION
        sync: false   # отдельная сессия для v2 (generate_session.py)
      - key: CHANNELS
        value: "markettwits"   # первичный сид; дальше список живёт в /admin
      - key: NEWS_CHANNELS
        value: "markettwits"
      - key: HISTORY
        value: "0"

databases:
  - name: tgparser-v2-db
    plan: free
